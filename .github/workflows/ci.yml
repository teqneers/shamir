name: CI
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'example'
    branches: [ master ]
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'example'
    branches: [ master ]
  # allow a manual run, and catch dependency/platform rot even when nothing is pushed
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        php-version: [
            "8.2",
            "8.3",
            "8.4",
            "8.5"
        ]
        dependencies: [
            "lowest",
            "highest"
        ]
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }} deps)
    steps:
      - name: checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath
          tools: composer:v2
          # no coverage service is wired up any more, so skip the driver
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      # composer.lock is not committed (this is a library), so key on composer.json
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
            restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: PHPUnit Tests
        run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    permissions:
      contents: read
      # lets the Codecov upload authenticate over OIDC instead of a stored token
      id-token: write
    steps:
      - name: checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      # Note: CliTest drives bin/shamir.php in a subprocess, so nothing it exercises
      # in src/Console is visible to the coverage driver running here. Those two
      # classes therefore report 0% despite being tested end to end.
      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # Runs in its own job on purpose: a Codecov outage should be visible rather
      # than silently swallowed, but it must not turn the test matrix red.
      #
      # Authenticates over OIDC rather than a CODECOV_TOKEN secret. The repository
      # lives in an organisation, where a stored upload token would have to be
      # created and rotated by an owner; OIDC needs nothing but the id-token
      # permission above. Pull requests from forks cannot mint an OIDC token, and
      # fall back to Codecov's tokenless path, which supports exactly that case.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - name: checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-phpstan-${{ hashFiles('composer.json') }}
            restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      # PHPStan needs more than PHP's default 128M; set it explicitly rather than
      # depending on whatever memory_limit the runner's ini happens to carry.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M


