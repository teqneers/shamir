name: CI
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'example'
    branches: [ master ]
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'example'
    branches: [ master ]
  # allow a manual run, and catch dependency/platform rot even when nothing is pushed
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        php-version: [
            "8.2",
            "8.3",
            "8.4",
            "8.5"
        ]
        dependencies: [
            "lowest",
            "highest"
        ]
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }} deps)
    steps:
      - name: checkout project
        uses: actions/checkout@v7
        with:
          # needed by scrutinizer
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath
          tools: composer:v2
          # needed by PHPUnit code coverage
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      # composer.lock is not committed (this is a library), so key on composer.json
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
            restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      # Run phpunit with code coverage
      - name: PHPUnit Tests
        run: vendor/bin/phpunit --coverage-clover=coverage.clover

      # Uploading reports for analysis. One upload is enough - the matrix runs the
      # same suite eight times, and a coverage service outage must not fail the build.
      #
      # ocular is fetched as a phar rather than required in composer.json on purpose:
      # scrutinizer/ocular caps symfony/console at ^6.0, which silently prevented the
      # matrix from ever resolving the symfony/console ^7.0 we claim to support.
      - name: Upload code-coverage to scrutinizer
        if: matrix.php-version == '8.4' && matrix.dependencies == 'highest'
        continue-on-error: true
        run: |
          wget -q https://scrutinizer-ci.com/ocular.phar
          php ocular.phar code-coverage:upload --format=php-clover coverage.clover


